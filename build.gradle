plugins {
    id 'java'
    id 'application'
    id 'idea'
    id 'info.solidsoft.pitest' version '1.19.0-rc.3'
}

application {
    mainClass = 'com.laosun.Main'
}

group = 'com.laosun'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    implementation 'com.google.code.gson:gson:2.14.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.jetbrains:annotations:24.0.0'
    implementation 'it.unimi.dsi:fastutil:8.5.18'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.19.0'
}

test {
    useJUnitPlatform()
    // AGENT.md is read by LedgerNumberGuardTest (§2.4). Without declaring it as an input, editing the ledger alone
    // leaves `:test` UP-TO-DATE, so the guard does not run at all - measured: a probe line carrying counts passed
    // until `--rerun-tasks` was added.
    inputs.file('AGENT.md')
}


tasks.withType(JavaExec).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

tasks.withType(Test).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

pitest {
    targetClasses = ['com.laosun.*']

    targetTests = ['com.laosun.*Test']

    mutators = ['DEFAULTS']

    outputFormats = ['HTML', 'XML']

    threads = 12

    junit5PluginVersion = '1.2.0'

    enableDefaultIncrementalAnalysis = true

    excludedClasses = ['com.laosun.Main']

    jvmArgs = ['-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8']
}

idea {
    module {
        downloadSources = true
    }
}


tasks.register('delombok', JavaExec) {
    group = 'documentation'
    description = 'Expands Lombok annotations into plain Java, for javadoc only.'
    dependsOn classes
    classpath = files(configurations.compileClasspath, "${buildDir}/classes/java/main")
    mainClass = 'lombok.launch.Main'
    args = ['delombok', 'src/main/java', '-d', "${buildDir}/delombok"]
    inputs.dir('src/main/java')
    outputs.dir("${buildDir}/delombok")
    doFirst { file("${buildDir}/delombok").mkdirs() }
}

tasks.named('javadoc') {
    dependsOn 'delombok'
    source = fileTree("${buildDir}/delombok") { include '**/*.java' }
    classpath = files(configurations.compileClasspath, configurations.annotationProcessor)
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:html,reference,accessibility,syntax', '-quiet')
    failOnError = false
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
