plugins {
    id 'java'
    id 'application'
    id 'idea'
    id 'info.solidsoft.pitest' version '1.19.0-rc.3'
}

application {
    mainClass = 'com.laosun.Main'
}

group = 'com.laosun'
version = '1.0-SNAPSHOT'

// ⚠ The version has to travel INSIDE the artifact to be readable FROM it. `Package.getImplementationVersion()` answers from the
// jar's own manifest, and returns null when the attribute is absent - which is the default, so the engine's jar used to carry no
// version at all. The TUI's About screen reports this one, so it is stated here rather than copied into that project at build time.
//
// ⚠ Main attributes, not per-package entries: they apply to every package in the jar, which is what makes the lookup work from the
// package of any engine class without naming every package in the build file.
tasks.named('jar') {
    manifest {
        attributes(
                'Implementation-Title': 'aluminium',
                'Implementation-Version': project.version,
                'Implementation-Vendor': project.group)
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// A dangling Javadoc comment is silently ignored by the javadoc tool, so a doc that drifted onto
// the wrong declaration used to be invisible. `-Werror` makes this category a compile gate instead
// of a warning; the option is JDK 21+ (measured on the project's JDK 25).
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:dangling-doc-comments', '-Werror']
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    implementation 'com.google.code.gson:gson:2.14.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.jetbrains:annotations:24.0.0'
    implementation 'it.unimi.dsi:fastutil:8.5.18'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.19.0'
}

// The engine is the `main` source set; the demo and the diagnostic tools are consumers of it,
// not part of its artifact. Keeping them out of `src/main/java` is what stops `Main`, the capture
// comparators and the benchmark from being compiled into the engine jar.
sourceSets {
    tools {
        java.srcDir 'src/tools/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    demo {
        java.srcDir 'src/demo/java'
        compileClasspath += sourceSets.main.output + sourceSets.tools.output
        runtimeClasspath += sourceSets.main.output + sourceSets.tools.output
    }
}

configurations {
    demoImplementation.extendsFrom implementation
    demoCompileOnly.extendsFrom compileOnly
    demoAnnotationProcessor.extendsFrom annotationProcessor
    demoRuntimeOnly.extendsFrom runtimeOnly
    toolsImplementation.extendsFrom implementation
    toolsCompileOnly.extendsFrom compileOnly
    toolsAnnotationProcessor.extendsFrom annotationProcessor
    toolsRuntimeOnly.extendsFrom runtimeOnly
}

// `Main` is the application entry point, but it lives in the demo source set now. `gradlew run`,
// its five modes and the TUI's jar all keep working; the engine jar does not carry it.
tasks.named('run') {
    classpath = sourceSets.demo.runtimeClasspath
}

sourceSets.test.compileClasspath += sourceSets.demo.output + sourceSets.tools.output
sourceSets.test.runtimeClasspath += sourceSets.demo.output + sourceSets.tools.output

test {
    useJUnitPlatform()
    // AGENT.md is read by LedgerNumberGuardTest (§2.4). Without declaring it as an input, editing the ledger alone
    // leaves `:test` UP-TO-DATE, so the guard does not run at all - measured: a probe line carrying counts passed
    // until `--rerun-tasks` was added.
    inputs.file('AGENT.md')
    // Same trap, same fix: TRIGGER.md is read by TriggerVocabularyDriftTest (§3.5) and TriggerEventTableDriftTest (§4).
    // Caught on 2026-10-29: mutating §4's table (dropping SUMMON_LEFT, changing the heading count) left `:test`
    // UP-TO-DATE, so the new guard stayed green while the document was wrong - a guard that does not run is worse than
    // none, because it is believed.
    inputs.file('TRIGGER.md')
    // When the requested task is `gate`, the tests must REALLY run: `gate` is the thing a report cites, and an
    // UP-TO-DATE `:test` rewrites the previous XML - the exact trap §3.3 documents. Plain `:test` stays incremental.
    outputs.upToDateWhen { !gradle.startParameter.taskNames.any { it == 'gate' || it.endsWith(':gate') } }
}


// ======================================================================
// `gate` - the four gates of AGENT.md §3.3, in one command.
//
// Why a task and not a checklist: the gates were five hand-typed commands plus "diff the demos against a baseline",
// and the ledger records two failures that came from running them by hand (a stale `:test` XML believed to be fresh;
// a demo compared against the wrong baseline). A task cannot be half-remembered, and it fails the build on the first
// non-zero exit, so "GATE: PASS" always means every step ran and returned 0.
//
// What it does NOT do: compare demo output against a stored baseline (that needs a human to say "this change is
// intended"), and mutation checks (AGENT.md §6.4 - those are per-change, not per-batch).
// ======================================================================
def demoModes = ['battle', 'mechanics', 'technique', 'driven', 'all']

def gateDemos = demoModes.collect { mode ->
    tasks.register("gateDemo${mode.capitalize()}", JavaExec) {
        group = 'verification'
        classpath = sourceSets.demo.runtimeClasspath
        mainClass = 'com.laosun.Main'
        args = mode == 'battle' ? [] : [mode]
    }
}

def gateCompares = fileTree('scenarios') { include 'capture-*.json' }.files.sort { it.name }.collect { scenario ->
    tasks.register("gateCompare${scenario.name.replaceAll(/[^A-Za-z0-9]/, '_')}", JavaExec) {
        group = 'verification'
        classpath = sourceSets.demo.runtimeClasspath
        mainClass = 'com.laosun.Main'
        args = ['compare', "scenarios/${scenario.name}"]
    }
}

tasks.register('gateReplay', JavaExec) {
    group = 'verification'
    description = 'The whole-battle replay, strict: exits 1 when any comparable cast\u2019s base differs.'
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.laosun.Main'
    args = ['replay', 'scenarios/veritas-085418.replay.json', '--strict']
}

// When `gate` is asked for, the compilers must run for real too - not just `:test`.
//
// ⚠ Measured 2026-10-29, and it is the reason this block exists: moving a class to a NEW PACKAGE left Gradle's
// incremental compile state with no rule to compile it, so `compileTestJava` reported UP-TO-DATE while four moved test
// classes had NO .class files at all. `:test` then ran a smaller suite and the gate printed PASS - a green that was
// missing four suites. `--rerun-tasks` produced them. A gate that can silently test less is worse than no gate, so the
// compilers are forced here exactly like `:test` is.
['compileJava', 'compileTestJava', 'compileToolsJava', 'compileDemoJava'].each { name ->
    tasks.named(name) {
        outputs.upToDateWhen { !gradle.startParameter.taskNames.any { it == 'gate' || it.endsWith(':gate') } }
    }
}

tasks.register('gate') {
    group = 'verification'
    description = 'All of AGENT.md \u00a73.3: full tests, every demo, every scenario comparison, the strict replay, javadoc.'
    dependsOn gateDemos, gateCompares, 'gateReplay', 'test', 'javadoc'
    // No outputs: a gate must run every time it is asked, never be "up to date".
    outputs.upToDateWhen { false }
    doLast {
        def results = fileTree("${buildDir}/test-results/test") { include '*.xml' }.files
        int tests = 0
        int failures = 0
        results.each { f ->
            def suite = new groovy.xml.XmlSlurper().parse(f)
            tests += (suite.@tests.text() as int)
            failures += (suite.@failures.text() as int) + (suite.@errors.text() as int)
        }
        println()
        println('=' * 78)
        println("GATE: PASS  tests=${tests} failures=${failures} suites=${results.size()}"
                + " ; demos=${gateDemos.size()} ; scenarios=${gateCompares.size()} ; replay --strict ; javadoc")
        println('=' * 78)
    }
}


tasks.withType(JavaExec).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

tasks.withType(Test).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

pitest {
    targetClasses = ['com.laosun.*']

    targetTests = ['com.laosun.*Test']

    mutators = ['DEFAULTS']

    outputFormats = ['HTML', 'XML']

    threads = 12

    junit5PluginVersion = '1.2.0'

    enableDefaultIncrementalAnalysis = true

    excludedClasses = ['com.laosun.Main']

    jvmArgs = ['-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8']
}

idea {
    module {
        downloadSources = true
    }
}


tasks.register('delombok', JavaExec) {
    group = 'documentation'
    description = 'Expands Lombok annotations into plain Java, for javadoc only.'
    dependsOn classes
    classpath = files(configurations.compileClasspath, "${buildDir}/classes/java/main")
    mainClass = 'lombok.launch.Main'
    args = ['delombok', 'src/main/java', '-d', "${buildDir}/delombok"]
    inputs.dir('src/main/java')
    outputs.dir("${buildDir}/delombok")
    // ⚠ The output directory must be EMPTY before each run. Lombok's delombok only writes the files it is handed, so a
    // file that was moved or renamed leaves its OLD copy behind - and `javadoc` builds every `**/*.java` under here, so
    // the orphan is compiled as a second class of the same name in a package it no longer belongs to.
    // Measured (2026-10-29, the `models` package split): 25 moved classes left their old copies under
    // `build/delombok/.../models/`, and `:javadoc` failed on symbols it could not find while `:compileJava` was green -
    // the stale copies were the only thing wrong. A `clean` fixes it, which is exactly why it would come back.
    doFirst {
        delete file("${buildDir}/delombok")
        file("${buildDir}/delombok").mkdirs()
    }
}

tasks.named('javadoc') {
    dependsOn 'delombok'
    source = fileTree("${buildDir}/delombok") { include '**/*.java' }
    classpath = files(configurations.compileClasspath, configurations.annotationProcessor)
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:html,reference,accessibility,syntax', '-quiet')
    options.addStringOption('Xwerror', '-quiet')
    failOnError = true
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
