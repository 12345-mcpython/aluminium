plugins {
    id 'java'
    id 'application'
    id 'idea'
    id 'info.solidsoft.pitest' version '1.19.0-rc.3'
}

application {
    mainClass = 'com.laosun.Main'
}

group = 'com.laosun'
version = '1.0-SNAPSHOT'

// ⚠ The version has to travel INSIDE the artifact to be readable FROM it. `Package.getImplementationVersion()` answers from the
// jar's own manifest, and returns null when the attribute is absent - which is the default, so the engine's jar used to carry no
// version at all. The TUI's About screen reports this one, so it is stated here rather than copied into that project at build time.
//
// ⚠ Main attributes, not per-package entries: they apply to every package in the jar, which is what makes the lookup work from the
// package of any engine class without naming every package in the build file.
tasks.named('jar') {
    manifest {
        attributes(
                'Implementation-Title': 'aluminium',
                'Implementation-Version': project.version,
                'Implementation-Vendor': project.group)
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// A dangling Javadoc comment is silently ignored by the javadoc tool, so a doc that drifted onto
// the wrong declaration used to be invisible. `-Werror` makes this category a compile gate instead
// of a warning; the option is JDK 21+ (measured on the project's JDK 25).
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:dangling-doc-comments', '-Werror']
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    implementation 'com.google.code.gson:gson:2.14.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.jetbrains:annotations:24.0.0'
    implementation 'it.unimi.dsi:fastutil:8.5.18'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.19.0'
}

// The engine is the `main` source set; the demo and the diagnostic tools are consumers of it,
// not part of its artifact. Keeping them out of `src/main/java` is what stops `Main`, the capture
// comparators and the benchmark from being compiled into the engine jar.
sourceSets {
    tools {
        java.srcDir 'src/tools/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    demo {
        java.srcDir 'src/demo/java'
        compileClasspath += sourceSets.main.output + sourceSets.tools.output
        runtimeClasspath += sourceSets.main.output + sourceSets.tools.output
    }
}

configurations {
    demoImplementation.extendsFrom implementation
    demoCompileOnly.extendsFrom compileOnly
    demoAnnotationProcessor.extendsFrom annotationProcessor
    demoRuntimeOnly.extendsFrom runtimeOnly
    toolsImplementation.extendsFrom implementation
    toolsCompileOnly.extendsFrom compileOnly
    toolsAnnotationProcessor.extendsFrom annotationProcessor
    toolsRuntimeOnly.extendsFrom runtimeOnly
}

// `Main` is the application entry point, but it lives in the demo source set now. `gradlew run`,
// its five modes and the TUI's jar all keep working; the engine jar does not carry it.
tasks.named('run') {
    classpath = sourceSets.demo.runtimeClasspath
}

sourceSets.test.compileClasspath += sourceSets.demo.output + sourceSets.tools.output
sourceSets.test.runtimeClasspath += sourceSets.demo.output + sourceSets.tools.output

test {
    useJUnitPlatform()
    // AGENT.md is read by LedgerNumberGuardTest (§2.4). Without declaring it as an input, editing the ledger alone
    // leaves `:test` UP-TO-DATE, so the guard does not run at all - measured: a probe line carrying counts passed
    // until `--rerun-tasks` was added.
    inputs.file('AGENT.md')
}


tasks.withType(JavaExec).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

tasks.withType(Test).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

pitest {
    targetClasses = ['com.laosun.*']

    targetTests = ['com.laosun.*Test']

    mutators = ['DEFAULTS']

    outputFormats = ['HTML', 'XML']

    threads = 12

    junit5PluginVersion = '1.2.0'

    enableDefaultIncrementalAnalysis = true

    excludedClasses = ['com.laosun.Main']

    jvmArgs = ['-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8']
}

idea {
    module {
        downloadSources = true
    }
}


tasks.register('delombok', JavaExec) {
    group = 'documentation'
    description = 'Expands Lombok annotations into plain Java, for javadoc only.'
    dependsOn classes
    classpath = files(configurations.compileClasspath, "${buildDir}/classes/java/main")
    mainClass = 'lombok.launch.Main'
    args = ['delombok', 'src/main/java', '-d', "${buildDir}/delombok"]
    inputs.dir('src/main/java')
    outputs.dir("${buildDir}/delombok")
    doFirst { file("${buildDir}/delombok").mkdirs() }
}

tasks.named('javadoc') {
    dependsOn 'delombok'
    source = fileTree("${buildDir}/delombok") { include '**/*.java' }
    classpath = files(configurations.compileClasspath, configurations.annotationProcessor)
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:html,reference,accessibility,syntax', '-quiet')
    options.addStringOption('Xwerror', '-quiet')
    failOnError = true
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
